name: Atualizar Resets EMPIRE4

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Consultar MUCABRASIL
        run: python scripts/update_resets.py

      - name: Salvar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resets.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao."
          else
            git commit -m "Atualizar resets da EMPIRE4"
            git push
          fi
